<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fruit Kart Pro 3D</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
  }
  body, html {
    width: 100%;
    height: 100%;
    background: #0d0d14;
    color: #fff;
    overflow: hidden;
  }
  #webglContainer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* Menús y Pantallas */
  .overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, #252538 0%, #0d0d14 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 16px;
    overflow-y: auto;
    z-index: 20;
  }
  .hidden { display: none !important; }

  h1 {
    font-size: 1.8rem;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ff3366, #ffcc00, #33ccff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 2px;
    text-align: center;
  }
  .subtitle { font-size: 0.8rem; color: #aaa; margin-bottom: 12px; text-align: center; }
  .section-title { font-size: 0.9rem; color: #ffcc00; margin: 8px 0 6px; text-transform: uppercase; font-weight: 700; }

  .grid-cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 480px;
  }
  .grid-maps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    width: 100%;
    max-width: 480px;
  }
  .card {
    background: rgba(25, 25, 40, 0.88);
    border: 2px solid #33334d;
    border-radius: 10px;
    padding: 8px;
    cursor: pointer;
    text-align: center;
    transition: transform 0.15s, border-color 0.15s;
  }
  .card.selected {
    border-color: #ffcc00;
    background: rgba(255, 204, 0, 0.12);
    transform: scale(1.02);
  }
  .card-icon { font-size: 1.8rem; margin-bottom: 2px; }
  .card-name { font-weight: 700; font-size: 0.85rem; margin-bottom: 2px; }
  .card-desc { font-size: 0.7rem; color: #bbb; line-height: 1.2; }

  .btn-start {
    margin-top: 14px;
    background: linear-gradient(135deg, #ff3366, #ff7733);
    border: none;
    color: white;
    font-weight: 800;
    font-size: 1rem;
    padding: 12px 32px;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 51, 102, 0.45);
    text-transform: uppercase;
  }

  /* HUD 3D */
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }
  .hud-box {
    background: rgba(15, 15, 25, 0.78);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 8px 12px;
    border-radius: 10px;
    backdrop-filter: blur(4px);
  }
  .pos-badge { font-size: 1.5rem; font-weight: 900; color: #ffcc00; }
  .lap-text { font-size: 0.8rem; color: #ddd; }
  .status-banner { font-size: 0.8rem; font-weight: 700; color: #00ffcc; margin-top: 2px; min-height: 1.1em; }
  .item-slot {
    width: 58px;
    height: 58px;
    border-radius: 12px;
    background: rgba(20,20,35,0.85);
    border: 3px solid #ffcc00;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 1.7rem;
  }
  .item-label { font-size: 0.55rem; color: #fff; text-transform: uppercase; font-weight: 700; }

  /* Controles Táctiles */
  #touchControls {
    position: absolute;
    bottom: 16px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 12;
    pointer-events: none;
  }
  .ctrl-group { display: flex; gap: 10px; pointer-events: auto; }
  .ctrl-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.16);
    border: 2px solid rgba(255, 255, 255, 0.35);
    color: #fff;
    font-weight: 800;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    cursor: pointer;
  }
  .ctrl-btn:active, .ctrl-btn.active { background: rgba(255, 204, 0, 0.45); border-color: #ffcc00; transform: scale(0.93); }
  .btn-drift { background: rgba(51, 204, 255, 0.22); border-color: #33ccff; font-size: 0.8rem; }
  .btn-item { background: rgba(255, 51, 102, 0.32); border-color: #ff3366; font-size: 0.8rem; }

  /* Resultados */
  .results-list { width: 100%; max-width: 380px; margin: 12px 0; }
  .res-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 14px;
    margin-bottom: 6px;
    background: rgba(25, 25, 40, 0.9);
    border-radius: 8px;
    border-left: 4px solid #ffcc00;
    font-weight: 700;
    font-size: 0.9rem;
  }
</style>

<!-- Three.js CDN para Gráficos 3D en Navegador móvil -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<!-- MENÚ PRINCIPAL -->
<div id="menuOverlay" class="overlay">
  <h1>🍓 Fruit Kart 3D</h1>
  <p class="subtitle">Carreras en Entorno Tridimensional vs Pro Bots</p>

  <div class="section-title">1. Elige tu Fruta</div>
  <div class="grid-cards" id="racerGrid"></div>

  <div class="section-title">2. Selecciona el Circuito</div>
  <div class="grid-maps" id="mapGrid"></div>

  <button class="btn-start" id="startBtn">¡Correr en 3D!</button>
</div>

<!-- PANTALLA DE RESULTADOS -->
<div id="resultOverlay" class="overlay hidden">
  <h1 id="resultTitle">¡Carrera Finalizada!</h1>
  <p class="subtitle">Clasificación Oficial 3D</p>
  <div class="results-list" id="resultsList"></div>
  <button class="btn-start" id="restartBtn">Menú Principal</button>
</div>

<!-- HUD 3D -->
<div id="hud" class="hidden">
  <div class="hud-box">
    <div>Posición: <span class="pos-badge" id="posDisplay">1/4</span></div>
    <div class="lap-text" id="lapDisplay">Vuelta: 1 / 3</div>
    <div class="status-banner" id="statusDisplay"></div>
  </div>
  <div class="item-slot" id="itemSlot">
    <span id="itemIcon">➖</span>
    <span class="item-label" id="itemLabel">Vacío</span>
  </div>
</div>

<!-- CONTROLES TÁCTILES -->
<div id="touchControls" class="hidden">
  <div class="ctrl-group">
    <div class="ctrl-btn" id="btnLeft">◀</div>
    <div class="ctrl-btn" id="btnRight">▶</div>
  </div>
  <div class="ctrl-group">
    <div class="ctrl-btn btn-drift" id="btnDrift">DRIFT</div>
    <div class="ctrl-btn btn-item" id="btnItem">ITEM</div>
  </div>
</div>

<div id="webglContainer"></div>

<script>
/* =========================================================
   CONFIGURACIÓN DE FRUTAS Y CIRCUITOS 3D
   ========================================================= */
const FRUITS = [
  { id: 'strawberry', name: 'Fresa Turbo', color: 0xff2a55, maxSpeed: 0.65, accel: 0.012, handling: 0.045, weight: 1.0, emoji: '🍓' },
  { id: 'banana', name: 'Banana Drift', color: 0xf1c40f, maxSpeed: 0.61, accel: 0.011, handling: 0.058, weight: 0.9, emoji: '🍌' },
  { id: 'watermelon', name: 'Sandía Tanque', color: 0x27ae60, maxSpeed: 0.62, accel: 0.010, handling: 0.040, weight: 1.5, emoji: '🍉' },
  { id: 'pineapple', name: 'Piña Rally', color: 0xf39c12, maxSpeed: 0.615, accel: 0.0115, handling: 0.048, weight: 1.1, emoji: '🍍' }
];

const MAPS = [
  { id: 'tropical', name: 'Tropical', color: 0x1b4d3e, roadColor: 0x3d3d4e, emoji: '🌴',
    waypoints: [{x:0, z:-120}, {x:90, z:-90}, {x:120, z:0}, {x:90, z:90}, {x:0, z:120}, {x:-90, z:90}, {x:-120, z:0}, {x:-90, z:-90}] },
  { id: 'glacier', name: 'Glaciar', color: 0x13384c, roadColor: 0x5c768d, emoji: '❄️',
    waypoints: [{x:0, z:-130}, {x:110, z:-110}, {x:130, z:20}, {x:60, z:80}, {x:110, z:130}, {x:-40, z:140}, {x:-120, z:60}, {x:-110, z:-80}] },
  { id: 'volcano', name: 'Volcán', color: 0x2c1111, roadColor: 0x2b2626, emoji: '🌋',
    waypoints: [{x:0, z:-110}, {x:100, z:-100}, {x:70, z:-20}, {x:130, z:60}, {x:50, z:130}, {x:-60, z:120}, {x:-130, z:40}, {x:-70, z:-50}] }
];

const ITEMS = [
  { id: 'nitro', name: 'Nitro', icon: '⚡' },
  { id: 'shield', name: 'Escudo', icon: '🥥' },
  { id: 'chili', name: 'Misil', icon: '🌶️' }
];

let selectedFruitIndex = 0;
let selectedMapIndex = 0;
let gameState = 'MENU';

// Variables Three.js
let scene, camera, renderer;
let karts = [], playerKart = null;
let trackPoints = [], trackRoadMesh, obstacles = [], itemBoxes = [];
const TOTAL_LAPS = 3;
let input = { left: false, right: false, drift: false };

/* =========================================================
   INICIALIZACIÓN DE MENÚS
   ========================================================= */
function initUI() {
  const rGrid = document.getElementById('racerGrid');
  rGrid.innerHTML = '';
  FRUITS.forEach((f, idx) => {
    const card = document.createElement('div');
    card.className = 'card' + (idx === selectedFruitIndex ? ' selected' : '');
    card.innerHTML = `<div class="card-icon">${f.emoji}</div><div class="card-name">${f.name}</div>`;
    card.onclick = () => { selectedFruitIndex = idx; initUI(); };
    rGrid.appendChild(card);
  });

  const mGrid = document.getElementById('mapGrid');
  mGrid.innerHTML = '';
  MAPS.forEach((m, idx) => {
    const card = document.createElement('div');
    card.className = 'card' + (idx === selectedMapIndex ? ' selected' : '');
    card.innerHTML = `<div class="card-icon">${m.emoji}</div><div class="card-name">${m.name}</div>`;
    card.onclick = () => { selectedMapIndex = idx; initUI(); };
    mGrid.appendChild(card);
  });
}
initUI();

/* =========================================================
   CONFIGURACIÓN DE ESCENA 3D
   ========================================================= */
function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d0d14);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById('webglContainer').appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(50, 100, 50);
  scene.add(dirLight);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}
initThree();

/* =========================================================
   CONSTRUCCIÓN DE PISTA Y OBJETOS 3D
   ========================================================= */
function buildTrack(mapData) {
  // Limpiar elementos anteriores
  scene.children.forEach(c => {
    if (c !== camera && c.type !== 'AmbientLight' && c.type !== 'DirectionalLight' && c.type !== 'Scene') {
      // conservar luces
    }
  });

  trackPoints = [];
  const wps = mapData.waypoints;
  const steps = 25;
  for (let i = 0; i < wps.length; i++) {
    const p0 = wps[(i - 1 + wps.length) % wps.length];
    const p1 = wps[i];
    const p2 = wps[(i + 1) % wps.length];
    const p3 = wps[(i + 2) % wps.length];

    for (let s = 0; s < steps; s++) {
      const t = s / steps;
      const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t * t + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t * t * t);
      const z = 0.5 * ((2 * p1.z) + (-p0.z + p2.z) * t + (2 * p0.z - 5 * p1.z + 4 * p2.z - p3.z) * t * t + (-p0.z + 3 * p1.z - 3 * p2.z + p3.z) * t * t * t);
      trackPoints.push(new THREE.Vector3(x, 0, z));
    }
  }

  // Dibujar Pista 3D
  const curve = new THREE.CatmullRomCurve3(trackPoints);
  curve.闭合 = true;
  const geometry = new THREE.TubeGeometry(curve, 120, 12, 8, true);
  const material = new THREE.MeshStandardMaterial({ color: mapData.roadColor, roughness: 0.8 });
  
  if (trackRoadMesh) scene.remove(trackRoadMesh);
  trackRoadMesh = new THREE.Mesh(geometry, material);
  trackRoadMesh.position.y = -0.5;
  scene.add(trackRoadMesh);

  // Cajas de mejoras 3D
  itemBoxes = [];
  for (let i = 15; i < trackPoints.length; i += 30) {
    const pt = trackPoints[i];
    const boxGeo = new THREE.BoxGeometry(3, 3, 3);
    const boxMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0x554400 });
    const boxMesh = new THREE.Mesh(boxGeo, boxMat);
    boxMesh.position.set(pt.x, 1, pt.z);
    scene.add(boxMesh);
    itemBoxes.push({ mesh: boxMesh, x: pt.x, z: pt.z, active: true, timer: 0 });
  }
}

/* =========================================================
   CREACIÓN DE KARTS 3D
   ========================================================= */
function createKart3D(fruit, isBot, index) {
  const startPt = trackPoints[0];
  const nextPt = trackPoints[2];
  const angle = Math.atan2(nextPt.x - startPt.x, nextPt.z - startPt.z);
  
  const offsetSide = (index % 2 === 0 ? -4 : 4);
  const offsetBack = Math.floor(index / 2) * -7;

  // Chasis 3D del Kart
  const kartGroup = new THREE.Group();
  
  const bodyGeo = new THREE.BoxGeometry(3.2, 1.4, 5);
  const bodyMat = new THREE.MeshStandardMaterial({ color: fruit.color, roughness: 0.3 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.8;
  kartGroup.add(body);

  // Ruedas 3D
  const wheelGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.6, 12);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  [-1.8, 1.8].forEach(wx => {
    [-1.8, 1.8].forEach(wz => {
      const wheel = new THREE.Mesh(wheelGeo, wheelMat);
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(wx, 0.8, wz);
      kartGroup.add(wheel);
    });
  });

  scene.add(kartGroup);

  return {
    fruit, isBot,
    name: isBot ? `[PRO] ${fruit.name}` : `Tú`,
    mesh: kartGroup,
    x: startPt.x + offsetSide,
    z: startPt.z + offsetBack,
    speed: 0,
    angle: angle,
    waypointIdx: 1,
    lap: 1,
    totalProgress: 0,
    boostTimer: 0,
    spinTimer: 0,
    shield: false,
    heldItem: null,
    finished: false,
    aiOffset: (Math.random() - 0.5) * 8
  };
}

function startRace() {
  const map = MAPS[selectedMapIndex];
  buildTrack(map);

  karts.forEach(k => scene.remove(k.mesh));
  karts = [];

  const playerFruit = FRUITS[selectedFruitIndex];
  playerKart = createKart3D(playerFruit, false, 0);
  karts.push(playerKart);

  let grid = 1;
  FRUITS.forEach((f, idx) => {
    if (idx !== selectedFruitIndex) {
      karts.push(createKart3D(f, true, grid++));
    }
  });

  document.getElementById('menuOverlay').classList.add('hidden');
  document.getElementById('resultOverlay').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('touchControls').classList.remove('hidden');
  updateItemUI();

  gameState = 'RACING';
}

/* =========================================================
   BUCLE DE JUEGO Y FÍSICA 3D
   ========================================================= */
function updateItemUI() {
  const icon = document.getElementById('itemIcon');
  const label = document.getElementById('itemLabel');
  if (!playerKart || !playerKart.heldItem) {
    icon.textContent = '➖'; label.textContent = 'Vacío';
  } else {
    icon.textContent = playerKart.heldItem.icon; label.textContent = playerKart.heldItem.name;
  }
}

function useItem(k) {
  if (!k.heldItem) return;
  const item = k.heldItem;
  k.heldItem = null;
  if (!k.isBot) updateItemUI();

  if (item.id === 'nitro') k.boostTimer = 100;
  else if (item.id === 'shield') k.shield = true;
}

function updateGame() {
  if (gameState !== 'RACING') return;

  karts.forEach(k => {
    if (k.finished) return;

    // Control Waypoints
    const target = trackPoints[k.waypointIdx];
    const dist = Math.hypot(target.x - k.x, target.z - k.z);
    if (dist < 18) {
      const prev = k.waypointIdx;
      k.waypointIdx = (k.waypointIdx + 1) % trackPoints.length;
      if (prev === trackPoints.length - 1 && k.waypointIdx === 0) {
        k.lap++;
        if (k.lap > TOTAL_LAPS) {
          k.finished = true;
          if (!k.isBot || karts.every(x => x.finished)) endRace();
        }
      }
    }
    k.totalProgress = (k.lap - 1) * trackPoints.length + k.waypointIdx;

    let steer = 0;
    if (!k.isBot) {
      if (input.left) steer -= 1;
      if (input.right) steer += 1;
    } else {
      // IA Pro Bot
      const wp = trackPoints[(k.waypointIdx + 4) % trackPoints.length];
      const targetAngle = Math.atan2(wp.x - k.x, wp.z - k.z);
      const diff = targetAngle - k.angle;
      if (Math.abs(diff) > 0.05) steer = diff > 0 ? 1 : -1;
      if (k.heldItem && Math.random() < 0.03) useItem(k);
    }

    k.angle += steer * k.fruit.handling;
    let targetSpeed = k.fruit.maxSpeed;
    if (k.boostTimer > 0) { k.boostTimer--; targetSpeed *= 1.5; }

    if (k.speed < targetSpeed) k.speed += k.fruit.accel;
    else k.speed *= 0.96;

    k.x += Math.sin(k.angle) * k.speed;
    k.z += Math.cos(k.angle) * k.speed;

    k.mesh.position.set(k.x, 0, k.z);
    k.mesh.rotation.y = k.angle;

    // Cajas de mejoras
    itemBoxes.forEach(b => {
      if (b.active && Math.hypot(b.x - k.x, b.z - k.z) < 4) {
        b.active = false;
        b.mesh.visible = false;
        b.timer = 200;
        if (!k.heldItem) {
          k.heldItem = ITEMS[Math.floor(Math.random() * ITEMS.length)];
          if (!k.isBot) updateItemUI();
        }
      }
    });
  });

  // Respawn cajas
  itemBoxes.forEach(b => {
    if (!b.active) {
      b.timer--;
      if (b.timer <= 0) { b.active = true; b.mesh.visible = true; }
    }
  });

  // Cámara en Tercera Persona 3D detrás del jugador
  if (playerKart) {
    const camX = playerKart.x - Math.sin(playerKart.angle) * 14;
    const camZ = playerKart.z - Math.cos(playerKart.angle) * 14;
    camera.position.set(camX, playerKart.mesh.position.y + 6, camZ);
    camera.lookAt(playerKart.x, playerKart.mesh.position.y + 1, playerKart.z + Math.sin(playerKart.angle) * 10);
  }

  // Actualizar HUD
  const sorted = [...karts].sort((a, b) => b.totalProgress - a.totalProgress);
  const pos = sorted.indexOf(playerKart) + 1;
  document.getElementById('posDisplay').textContent = `${pos}/4`;
  document.getElementById('lapDisplay').textContent = `Vuelta: ${Math.min(playerKart.lap, TOTAL_LAPS)} / ${TOTAL_LAPS}`;
}

function endRace() {
  gameState = 'RESULTS';
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('touchControls').classList.add('hidden');

  const sorted = [...karts].sort((a, b) => b.totalProgress - a.totalProgress);
  const list = document.getElementById('resultsList');
  list.innerHTML = '';
  sorted.forEach((k, i) => {
    const row = document.createElement('div');
    row.className = 'res-row';
    row.innerHTML = `<span>#${i + 1} ${k.fruit.emoji} ${k.name}</span><span>${i === 0 ? '👑 Ganador' : 'Meta'}</span>`;
    list.appendChild(row);
  });
  document.getElementById('resultOverlay').classList.remove('hidden');
}

function animate() {
  requestAnimationFrame(animate);
  updateGame();
  renderer.render(scene, camera);
}
animate();

/* =========================================================
   CONTROLES TÁCTILES Y DE TECLADO
   ======================================================== */
function bindBtn(id, key) {
  const el = document.getElementById(id);
  const start = (e) => { e.preventDefault(); input[key] = true; el.classList.add('active'); };
  const end = (e) => { e.preventDefault(); input[key] = false; el.classList.remove('active'); };
  el.addEventListener('touchstart', start, { passive: false });
  el.addEventListener('touchend', end, { passive: false });
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
}

bindBtn('btnLeft', 'left');
bindBtn('btnRight', 'right');
bindBtn('btnDrift', 'drift');

document.getElementById('btnItem').onclick = () => { if (playerKart) useItem(playerKart); };
document.getElementById('startBtn').onclick = startRace;
document.getElementById('restartBtn').onclick = () => {
  document.getElementById('resultOverlay').classList.add('hidden');
  document.getElementById('menuOverlay').classList.remove('hidden');
  gameState = 'MENU';
};

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') input.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') input.right = true;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') input.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') input.right = false;
});
